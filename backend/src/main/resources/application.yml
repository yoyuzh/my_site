server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: yoyuzh-portal-backend
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
      repositories:
        enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/yoyuzh_portal?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-expiration-seconds: 900
    refresh-expiration-seconds: 1209600
  admin:
    usernames: ${APP_ADMIN_USERNAMES:}
  registration:
    invite-code: ${APP_AUTH_REGISTRATION_INVITE_CODE:}
  android:
    metadata-object-key: ${YOYUZH_ANDROID_RELEASE_METADATA_OBJECT_KEY:android/releases/latest.json}
    download-public-url: ${YOYUZH_ANDROID_DOWNLOAD_PUBLIC_URL:https://api.yoyuzh.xyz/api/app/android/download}
  storage:
    provider: ${YOYUZH_STORAGE_PROVIDER:local}
    max-file-size: ${YOYUZH_STORAGE_MAX_FILE_SIZE:524288000}
    local:
      root-dir: ${YOYUZH_STORAGE_LOCAL_ROOT_DIR:./storage}
    s3:
      api-base-url: ${YOYUZH_DOGECLOUD_API_BASE_URL:https://api.dogecloud.com}
      api-access-key: ${YOYUZH_DOGECLOUD_API_ACCESS_KEY:}
      api-secret-key: ${YOYUZH_DOGECLOUD_API_SECRET_KEY:}
      scope: ${YOYUZH_DOGECLOUD_STORAGE_SCOPE:}
      ttl-seconds: ${YOYUZH_DOGECLOUD_STORAGE_TTL_SECONDS:3600}
      region: ${YOYUZH_DOGECLOUD_S3_REGION:automatic}
      public-download-base-url: ${YOYUZH_DOGECLOUD_PUBLIC_DOWNLOAD_BASE_URL:}
      package-download-base-url: ${YOYUZH_PACKAGE_DOWNLOAD_BASE_URL:https://api.yoyuzh.xyz/_dl}
      package-download-secret: ${YOYUZH_PACKAGE_DOWNLOAD_SECRET:}
      package-download-ttl-seconds: ${YOYUZH_PACKAGE_DOWNLOAD_TTL_SECONDS:300}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost
      - https://localhost
      - http://127.0.0.1
      - https://127.0.0.1
      - capacitor://localhost
      - https://yoyuzh.xyz
      - https://www.yoyuzh.xyz
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
    key-prefix: ${APP_REDIS_KEY_PREFIX:yoyuzh}
    ttl-buffer-seconds: ${APP_REDIS_TTL_BUFFER_SECONDS:60}
    cache:
      files-list-ttl-seconds: ${APP_REDIS_CACHE_FILES_LIST_TTL_SECONDS:60}
      directory-version-ttl-seconds: ${APP_REDIS_CACHE_DIRECTORY_VERSION_TTL_SECONDS:3600}
      admin-summary-ttl-seconds: ${APP_REDIS_CACHE_ADMIN_SUMMARY_TTL_SECONDS:30}
      storage-policies-ttl-seconds: ${APP_REDIS_CACHE_STORAGE_POLICIES_TTL_SECONDS:300}
      android-release-ttl-seconds: ${APP_REDIS_CACHE_ANDROID_RELEASE_TTL_SECONDS:60}
    namespaces:
      cache: ${APP_REDIS_NAMESPACE_CACHE:cache}
      auth: ${APP_REDIS_NAMESPACE_AUTH:auth}
      transfer-sessions: ${APP_REDIS_NAMESPACE_TRANSFER_SESSIONS:transfer-sessions}
      upload-state: ${APP_REDIS_NAMESPACE_UPLOAD_STATE:upload-state}
      locks: ${APP_REDIS_NAMESPACE_LOCKS:locks}
      file-events: ${APP_REDIS_NAMESPACE_FILE_EVENTS:file-events}
      broker: ${APP_REDIS_NAMESPACE_BROKER:broker}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:logback.xml
