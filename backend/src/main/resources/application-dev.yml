spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:1}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  datasource:
    url: jdbc:h2:file:./data/yoyuzh_portal_dev;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:dev-h2-preinit.sql
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
  admin:
    usernames: ${APP_ADMIN_USERNAMES:admin}
  registration:
    invite-code: ${APP_AUTH_REGISTRATION_INVITE_CODE:dev-invite-code}
  transfer:
    remote-download:
      aria2:
        base-url: ${APP_REMOTE_DOWNLOAD_ARIA2_BASE_URL:http://127.0.0.1:6800/jsonrpc}
      qbittorrent:
        base-url: ${APP_REMOTE_DOWNLOAD_QBITTORRENT_BASE_URL:http://127.0.0.1:8081}
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
    cache:
      directory-version-ttl-seconds: ${APP_REDIS_CACHE_DIRECTORY_VERSION_TTL_SECONDS:3600}
